volumes:
  kaleem_local_postgres_data: {}
  kaleem_local_postgres_data_backups: {}
  kaleem_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: kaleem_local_django
    container_name: kaleem_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  frontend:
    build:
      context: ./frontend
      dockerfile: ../compose/local/frontend/Dockerfile
    image: kaleem_local_frontend
    container_name: kaleem_local_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    env_file:
      - ./.envs/.local/.frontend

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: kaleem_production_postgres
    container_name: kaleem_local_postgres
    volumes:
      - kaleem_local_postgres_data:/var/lib/postgresql/data
      - kaleem_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - "5432:5432"

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: kaleem_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: kaleem_local_redis

    volumes:
      - kaleem_local_redis_data:/data

  celeryworker:
    <<: *django
    image: kaleem_local_celeryworker
    container_name: kaleem_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: kaleem_local_celerybeat
    container_name: kaleem_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: kaleem_local_flower
    container_name: kaleem_local_flower
    ports:
      - "5555:5555"
    command: /start-flower
