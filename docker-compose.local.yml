# Inject the host UID/GID into every dev image so containers write
# bind-mounted files as the developer, not root. HOST_UID/HOST_GID come from
# the justfile (`id -u`/`id -g`); 1000 is the fallback.
x-uidgid: &uidgid
  UID: ${HOST_UID:-1000}
  GID: ${HOST_GID:-1000}

services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
      - --api.dashboard=true
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard → http://localhost:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  django:
    build:
      context: ./backend
      target: dev
      args: *uidgid
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      # In-container hostnames override the localhost values in .env
      # (which are correct for host tooling: pytest, `just migrate`).
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.kaleem.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000

  postgres:
    image: postgres:18-alpine
    volumes:
      # PG 18+ images store data in a major-version subdir under
      # /var/lib/postgresql; mount the parent, not .../data. See ADR-0015.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kaleem
      POSTGRES_USER: kaleem
      POSTGRES_PASSWORD: kaleem
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaleem"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      target: dev
      args: *uidgid
    command: celery -A config.celery_app worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      target: dev
      args: *uidgid
    command: celery -A config.celery_app beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: ./backend
      target: dev
      args: *uidgid
    command: celery -A config.celery_app flower --port=5555
    volumes:
      - ./backend:/app
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.flower.rule=Host(`flower.kaleem.localhost`)
      - traefik.http.routers.flower.entrypoints=web
      - traefik.http.services.flower.loadbalancer.server.port=5555

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail.rule=Host(`mail.kaleem.localhost`)
      - traefik.http.routers.mail.entrypoints=web
      - traefik.http.services.mail.loadbalancer.server.port=8025

  dashboard:
    build:
      context: ./dashboard
      target: dev
      args: *uidgid
      secrets:
        - tokens_token
    environment:
      - VITE_API_URL=http://api.kaleem.localhost
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.kaleem.localhost`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=5173

  marketing:
    build:
      context: ./marketing
      target: dev
      args: *uidgid
      secrets:
        - tokens_token
    volumes:
      - ./marketing:/app
      - marketing_node_modules:/app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`kaleem.localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=4321

volumes:
  postgres_data:
  dashboard_node_modules:
  marketing_node_modules:

secrets:
  tokens_token:
    environment: GH_TOKEN
