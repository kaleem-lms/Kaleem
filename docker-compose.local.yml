services:
  django:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      # In-container hostnames override the localhost values in .env
      # (which are correct for host tooling: pytest, `just migrate`).
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    volumes:
      # PG 18+ images store data in a major-version subdir under
      # /var/lib/postgresql; mount the parent, not .../data. See ADR-0015.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kaleem
      POSTGRES_USER: kaleem
      POSTGRES_PASSWORD: kaleem
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaleem"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config.celery_app worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config.celery_app beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_READ_DOT_ENV_FILE=True
      - DATABASE_URL=postgres://kaleem:kaleem@postgres:5432/kaleem
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
