name: Build and Deploy to Lightsail

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GHCR
      run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Convert repo owner to lowercase
      run: echo "OWNER_LC=$(echo $OWNER | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Create temporary env files
      run: |
        mkdir -p kaleem/.envs/.production
        touch kaleem/.envs/.production/.django
        touch kaleem/.envs/.production/.postgres
        touch kaleem/.envs/.production/.frontend

    - name: Build all images with docker-compose
      run: |
        docker compose -f ./kaleem/docker-compose.production.yml build \
          --build-arg REGISTRY=$REGISTRY \
          --build-arg OWNER=$OWNER_LC

    - name: Push all images with docker-compose
      run: |
        docker compose -f ./kaleem/docker-compose.production.yml push

    - name: SSH into Lightsail and Deploy
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.LIGHTSAIL_HOST }}
        username: ${{ secrets.LIGHTSAIL_USERNAME }}
        key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        script: |
          cd /home/admin/Kaleem/kaleem
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo docker compose -f docker-compose.production.yml pull
          sudo docker compose -f docker-compose.production.yml up -d
