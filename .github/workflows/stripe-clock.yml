name: Stripe test clock

# Nightly, not per PR, and deliberately NOT in deploy-staging's `needs:`.
# Three reasons, recorded in the spec: test clocks are account-scoped so parallel
# PRs would collide; forked PRs cannot read secrets, and ISSUES.md already carries
# an entry about a skipped job looking like success; and a Stripe outage must not
# block every merge. The cost is that a renewal-path regression is caught within
# 24h rather than before merge — the right trade for drift in an external payload
# shape, the wrong one for anything we author. A red run here is a real failure.
on:
  schedule:
    # Weekly, not nightly (2026-09-08). The trade is explicit: a renewal-path
    # regression is now caught within 7 days rather than 24 hours. It watches
    # for drift in an external payload shape, which is not a daily event.
    - cron: "17 3 * * 4"
  workflow_dispatch:

concurrency:
  group: stripe-clock
  cancel-in-progress: false

jobs:
  dunning:
    runs-on: ubuntu-latest
    # Measured runs: 2m49s and 4m19s. Stripe's clock-advance speed varies ~50%
    # run to run, so this is sized off the slow figure, not the fast one.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kaleem_clock
          POSTGRES_USER: kaleem
          POSTGRES_PASSWORD: kaleem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://kaleem:kaleem@localhost:5432/kaleem_clock
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # This is the Stripe *account* default, which is what `stripe listen` forwards
      # events at — it offers no way to forward at an arbitrary pin. Without this set
      # explicitly the harness falls back to the installed SDK's default version and
      # the harness's version assertion fails permanently, not just on real drift. If
      # Stripe moves the account default, update this value (see docs/runbook/stripe-billing.md).
      DJANGO_STRIPE_API_VERSION: "2025-06-30.basil"
      # STRIPE_CLOCK_PRICE_ID is deliberately NOT set here. tests/stripe_clock/conftest.py
      # already has a working default price id, and setting this env var — even wiring
      # it to an optional secret — would override that default. An unset secret resolves
      # to an empty string, not "absent", so os.environ.get(..., default) would return ""
      # instead of the default and the credential guard would fail every run.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      # Pinned and digest-checked: v1.51 changed `stripe listen` without notice and
      # turned this harness red. Bump deliberately (docs/runbook/stripe-billing.md).
      - name: Install the Stripe CLI (pinned)
        env:
          STRIPE_CLI_VERSION: "1.53.1"
          STRIPE_CLI_SHA256: "032fe0b849a9d6a222488bc846445bafeae993af1026b78a8121d02321ca1fd1"
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSL -o stripe.tar.gz \
            "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          echo "${STRIPE_CLI_SHA256}  stripe.tar.gz" | sha256sum -c -
          tar -xzf stripe.tar.gz stripe
          sudo install -m 0755 stripe /usr/local/bin/stripe
          stripe version | tee /dev/stderr | grep -Fx "stripe version ${STRIPE_CLI_VERSION}" >/dev/null
      # The test session compiles the translation catalogs (rch-i18n-server-strings), which
      # shells out to GNU gettext. Same check as ci.yml.
      - name: Ensure GNU gettext
        run: |
          command -v msgfmt >/dev/null && command -v xgettext >/dev/null \
            || { sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gettext; }
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Run the dunning harness
        run: pytest -m stripe_clock tests/stripe_clock/ -v
