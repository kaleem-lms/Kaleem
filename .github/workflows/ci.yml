name: CI

# Trunk-based since ADR-0028: there is no `develop` branch, so every PR targets the
# trunk and every check runs on the PR that introduces the change. `develop` was
# briefly listed here (2026-09-03) because until then no `feat -> develop` PR ran CI
# at all — the first check was the promotion, which was also the deploy. That is how
# two full phases reached staging unverified. Removing the branch removed the problem.
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Import linter
        run: lint-imports

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kaleem_test
          POSTGRES_USER: kaleem
          POSTGRES_PASSWORD: kaleem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://kaleem:kaleem@localhost:5432/kaleem_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      # D3 coverage gate. The floor lives in backend/pyproject.toml
      # ([tool.coverage.report] fail_under), NOT here, so the gate runs
      # identically on a developer's machine and on this runner. It is a ratchet
      # floor set to the measured value, not the 100% target — see ADR-0026.
      - name: Run tests with coverage
        run: pytest --cov=kaleem --cov-report=term-missing -v

  dashboard-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Configure git auth for private @kaleem/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm tsc --noEmit
      # Until 2026-09-03 this job ran tsc ONLY: vitest, biome and coverage were
      # never executed in CI at all, so D3 was unenforceable for the dashboard
      # (see ADR-0026). Coverage thresholds live in dashboard/vitest.config.ts.
      - name: Biome
        run: pnpm lint
      - name: Tests with coverage
        run: pnpm test:coverage

  dashboard-build:
    runs-on: ubuntu-latest
    needs: dashboard-lint
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Configure git auth for private @kaleem/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # ADR-0021 has required end-to-end tests since 2026-06-17 and no harness existed
  # until 2026-09-03; ADR-0026 recorded the clause as suspended in the meantime. This
  # job un-suspends it for identity. It deliberately mirrors the ADR-0019 subdomain
  # topology rather than serving both halves from localhost: cookies ignore ports, so
  # `localhost:4173` + `localhost:8000` would share a session by accident and prove
  # nothing about the cross-subdomain cookie that production actually depends on.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kaleem_e2e
          POSTGRES_USER: kaleem
          POSTGRES_PASSWORD: kaleem
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://kaleem:kaleem@localhost:5432/kaleem_e2e
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local
      # No mailpit here; an unreachable SMTP host would turn an incidental send into
      # a 500 rather than a no-op.
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      E2E_APP_URL: http://app.kaleem.localhost:4173
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Map the kaleem.localhost subdomains
        run: |
          echo "127.0.0.1 app.kaleem.localhost api.kaleem.localhost" | sudo tee -a /etc/hosts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Configure git auth for private @kaleem/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements/local.txt
      - name: Migrate and seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e
      - name: Start the API
        working-directory: backend
        run: |
          nohup python manage.py runserver api.kaleem.localhost:8000 --noreload \
            > /tmp/django.log 2>&1 &
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://api.kaleem.localhost:8000/health/ready/ && exit 0
            sleep 2
          done
          echo "::error::API never became ready"; cat /tmp/django.log; exit 1

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: Build the dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://api.kaleem.localhost:8000/api/v1/
        run: pnpm build
      - name: Serve the built dashboard
        working-directory: dashboard
        run: |
          nohup pnpm preview --host app.kaleem.localhost --port 4173 \
            > /tmp/preview.log 2>&1 &
      - name: Wait for the dashboard
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://app.kaleem.localhost:4173/ && exit 0
            sleep 2
          done
          echo "::error::Dashboard never became ready"; cat /tmp/preview.log; exit 1

      - name: Install Playwright chromium
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        working-directory: dashboard
        run: pnpm e2e

      # A red e2e job with no artefact is a guessing game.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
            /tmp/django.log
            /tmp/preview.log
          retention-days: 7

  # ADR-0030. The Definition of Done has asked for a security pass since 2026-06-17
  # and nothing ever ran one: `pip-audit`, `semgrep`, `trivy` and `gitleaks`-as-CI were
  # all absent, so the gate was satisfied by a human saying "reviewed manually" at
  # handoff. The first execution of this job found live credentials in this repo's
  # history (see `.gitleaksignore`) and a stray Stripe portal secret in a committed
  # Playwright dump. Same shape as the coverage and e2e gates before ADR-0026/0027.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          # gitleaks git-mode scans commits; the default shallow checkout would give
          # it exactly one to look at.
          fetch-depth: 0

      # Known historical findings are allowlisted by fingerprint in `.gitleaksignore`,
      # one annotated line each, so a NEW secret in a NEW commit still fails here.
      # The image is pinned: an unpinned scanner changes what "green" means without a
      # commit.
      - name: Gitleaks — meta repo history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

      # Directory mode covers the submodule working trees — the code the deploy is
      # actually built from — which the history scan above cannot see. Submodule
      # *histories* are covered only by their own pre-commit hooks (ADR-0030, known gap).
      - name: Gitleaks — checked-out tree, submodules included
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner --exit-code 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Production dependencies only, installed into their own venv so pip-audit's own
      # dependency tree is not part of what is audited. A CVE in `pytest` cannot reach
      # a user, and a gate that goes red for something harmless is a gate people learn
      # to click past.
      - name: Install the production dependency set
        working-directory: backend
        run: |
          python -m venv /tmp/prodenv
          /tmp/prodenv/bin/pip install --quiet -r requirements/production.txt
          pip install --quiet pip-audit
      - name: pip-audit
        run: pip-audit --progress-spinner off --path /tmp/prodenv/lib/python3.13/site-packages

  marketing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: marketing/pnpm-lock.yaml
      - name: Configure git auth for private @kaleem/tokens
        run: |
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${{ secrets.TOKENS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  deploy-staging:
    needs:
      [
        backend-lint,
        backend-test,
        dashboard-lint,
        dashboard-build,
        e2e,
        marketing-build,
        security,
      ]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            --target production \
            -t ghcr.io/kaleem-lms/backend:${{ env.SHORT_SHA }} \
            -t ghcr.io/kaleem-lms/backend:latest \
            backend/

      - name: Push backend image
        run: |
          docker push ghcr.io/kaleem-lms/backend:${{ env.SHORT_SHA }}
          docker push ghcr.io/kaleem-lms/backend:latest

      - name: Build dashboard image
        env:
          DOCKER_BUILDKIT: "1"
          TOKENS_REPO_TOKEN: ${{ secrets.TOKENS_REPO_TOKEN }}
        run: |
          docker build \
            -f dashboard/Dockerfile \
            --target production \
            --secret id=tokens_token,env=TOKENS_REPO_TOKEN \
            --build-arg VITE_API_URL=https://api-staging.kaleem.academy/api/v1/ \
            -t ghcr.io/kaleem-lms/dashboard:${{ env.SHORT_SHA }} \
            -t ghcr.io/kaleem-lms/dashboard:latest \
            dashboard/

      - name: Push dashboard image
        run: |
          docker push ghcr.io/kaleem-lms/dashboard:${{ env.SHORT_SHA }}
          docker push ghcr.io/kaleem-lms/dashboard:latest

      - name: Build marketing image
        env:
          DOCKER_BUILDKIT: "1"
          TOKENS_REPO_TOKEN: ${{ secrets.TOKENS_REPO_TOKEN }}
        run: |
          docker build \
            -f marketing/Dockerfile \
            --target production \
            --secret id=tokens_token,env=TOKENS_REPO_TOKEN \
            -t ghcr.io/kaleem-lms/marketing:${{ env.SHORT_SHA }} \
            -t ghcr.io/kaleem-lms/marketing:latest \
            marketing/

      - name: Push marketing image
        run: |
          docker push ghcr.io/kaleem-lms/marketing:${{ env.SHORT_SHA }}
          docker push ghcr.io/kaleem-lms/marketing:latest

      # Push the current infra config to the VPS BEFORE running ship.sh.
      # Without this, compose-topology / ship.sh changes (e.g. new services)
      # never reach /opt/kaleem — only the rebuilt image is delivered.
      # .env.production is intentionally NOT synced: it holds secrets and is
      # managed on the VPS.
      - name: Sync infra config to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "infra/docker-compose.production.yml,infra/scripts/ship.sh,infra/traefik/traefik.yml"
          target: /opt/kaleem
          strip_components: 1
          # /opt/kaleem already holds hand-provisioned copies; replace them with
          # the repo version (default is false, which makes tar refuse to extract
          # over existing files: "Cannot open: File exists").
          overwrite: true

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: SHORT_SHA
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/kaleem
            export DEPLOY_SHA=$SHORT_SHA
            bash scripts/ship.sh $SHORT_SHA
