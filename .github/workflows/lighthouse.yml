name: Lighthouse

# Nightly against STAGING, deliberately not a merge gate (ADR-0030) — the same shape,
# and for the same reason, as the Stripe test-clock harness: it measures a *deployed*
# environment, and staging only exists after the merge. A per-PR run would have to
# measure `vite preview` on a shared CI runner, which grades the runner's CPU
# contention more than the delivered site.
#
# The thresholds live in `.lighthouserc.json` and are ratchet floors set to the value
# measured on 2026-09-04, in the ADR-0026 sense — not aspirational 100s. Lowering one
# needs an ADR; raising one is a normal part of any PR that improves a score.
#
# A red run is a real failure. Network noise on a single sample looks the same as a
# regression, so `numberOfRuns` is 3 and the median is asserted; if it is still red,
# read the uploaded report before assuming flake.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No submodules: this job measures a running site, not the source tree. Only
      # `.lighthouserc.json` from the meta repo is needed.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The dashboard URL is the LOGIN PAGE only — everything past it needs a session,
      # and pointing a scanner with a seeded credential at a shared environment is a
      # bigger decision than this workflow (ADR-0030).
      - name: Run Lighthouse CI against staging
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 14
