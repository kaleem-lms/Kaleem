# Test fixture: a path-only access log, but a bare "$uri/" in try_files. A request for
# a directory with no index file then lands in nginx's ERROR log, which names the full
# request line and the Referer. check-nginx-access-log.sh must catch that.
map $request_uri $kaleem_log_path {
    "~^(?<p>[^?]*)" $p;
}
log_format kaleem_path '$time_iso8601 "$request_method $kaleem_log_path" $status';
server {
    listen 80;
    server_name _;
    access_log /dev/stdout kaleem_path;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ =404;
    }
}
