# Test fixture: logs nothing at all. Trivially free of a leaked value, and useless.
# check-nginx-access-log.sh must REJECT this too (its path positive control).
server {
    listen 80;
    server_name _;
    access_log off;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
