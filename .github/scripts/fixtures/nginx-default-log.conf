# Test fixture: no access_log directive, so the nginx image's default applies
# (the `main` format, which records the full request line and the Referer).
# check-nginx-access-log.sh must REJECT this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
